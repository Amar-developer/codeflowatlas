[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "cfa-ir"
version = "0.1.0"
description = "CodeFlowAtlas intermediate representation: versioned graph contract between analyzers and the product"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14,<3"]

[tool.setuptools.packages.find]
include = ["cfa_ir*"]