services:
  web:
    build:
      target: deps
    command: npm run dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  db:
    ports:
      - "127.0.0.1:5434:5432"

  migrate:
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions:ro

  api:
    environment:
      COOKIE_SECURE: "false"
    volumes:
     - ./backend/alembic/versions:/app/alembic/versions  

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"   

volumes:
  frontend_node_modules:
  frontend_next:
